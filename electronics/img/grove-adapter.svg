<path d="M300.0 216.0 L316.0 203.0 L324.0 203.0" fill="none" stroke="#6B7280" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300.0 216.0 L316.0 203.0 L324.0 203.0" fill="none" stroke="#EAB308" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="344" y="201.4" width="34" height="3.2" fill="#C9A227"/>
<text x="388.0" y="203.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">黄 → X</text>
<path d="M300.0 222.0 L316.0 217.5 L324.0 217.5" fill="none" stroke="#6B7280" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300.0 222.0 L316.0 217.5 L324.0 217.5" fill="none" stroke="#F3F4F6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="344" y="215.9" width="34" height="3.2" fill="#C9A227"/>
<text x="388.0" y="217.5" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">白 → Y</text>
<path d="M300.0 228.0 L316.0 232.0 L324.0 232.0" fill="none" stroke="#6B7280" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300.0 228.0 L316.0 232.0 L324.0 232.0" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="344" y="230.4" width="34" height="3.2" fill="#C9A227"/>
<text x="388.0" y="232.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">赤 → VCC</text>
<path d="M300.0 234.0 L316.0 246.5 L324.0 246.5" fill="none" stroke="#6B7280" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M300.0 234.0 L316.0 246.5 L324.0 246.5" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="344" y="244.9" width="34" height="3.2" fill="#C9A227"/>
<text x="388.0" y="246.5" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">黒 → GND</text>
<text x="480.0" y="207.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="400">並びは コネクタと同じ 黄・白・赤・黒 (ジョイスティックでは X・Y・VCC・GND)</text>
<text x="480.0" y="227.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="400">できたら テスターの導通ブザーで 4 本とも鳴るか、</text>
<text x="480.0" y="243.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="400">隣どうしで鳴らない (ショートしていない) かを確かめる</text>
<text x="480.0" y="267.0" font-size="9.5" fill="#6B7280" text-anchor="start" dominant-baseline="central" font-weight="400">ブレッドボードに挿したヘッダーの上ではんだ付けすると、ピンが熱で動かない</text>
</svg>
