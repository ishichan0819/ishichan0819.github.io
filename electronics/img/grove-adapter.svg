<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Noto Sans CJK JP',Meiryo,sans-serif">
<title id="t">Grove ケーブルからジョイスティック用の変換ケーブルを作る</title>
<desc id="d">Grove ケーブル (両端コネクタ) を真ん中で切ると 2 本できる。切った側の 4 本の皮をむいて予備はんだし、1×40 のピンヘッダーから切り出した 4 ピンにはんだ付けする。並びは 黄・白・赤・黒。</desc>
<rect width="900" height="300" rx="14" fill="#FBFAF7"/>
<text x="30.0" y="30.0" font-size="12" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700">1. 真ん中で切る (1 本から 2 本できる)</text>
<rect x="40" y="68" width="30" height="44" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
<rect x="46" y="74" width="18" height="32" rx="2" fill="#E5E7EB" stroke="#9CA3AF"/>
<path d="M70.0 81.0 L380.0 81.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 81.0 L380.0 81.0" fill="none" stroke="#EAB308" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 87.0 L380.0 87.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 87.0 L380.0 87.0" fill="none" stroke="#F3F4F6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 93.0 L380.0 93.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 93.0 L380.0 93.0" fill="none" stroke="#DC2626" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 99.0 L380.0 99.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 99.0 L380.0 99.0" fill="none" stroke="#111827" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="380" y="68" width="30" height="44" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
<rect x="386" y="74" width="18" height="32" rx="2" fill="#E5E7EB" stroke="#9CA3AF"/>
<line x1="225" y1="60" x2="225" y2="120" stroke="#B91C1C" stroke-width="2" stroke-dasharray="5 4"/>
<text x="225.0" y="134.0" font-size="10" fill="#B91C1C" text-anchor="middle" dominant-baseline="central" font-weight="700">ここで切る</text>
<text x="470.0" y="30.0" font-size="12" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700">2. 先を 5mm むいて、ねじって、はんだを薄くのせる</text>
<rect x="480" y="68" width="30" height="44" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
<rect x="486" y="74" width="18" height="32" rx="2" fill="#E5E7EB" stroke="#9CA3AF"/>
<path d="M510.0 81.0 L700.0 81.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510.0 81.0 L700.0 81.0" fill="none" stroke="#EAB308" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510.0 87.0 L700.0 87.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510.0 87.0 L700.0 87.0" fill="none" stroke="#F3F4F6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510.0 93.0 L700.0 93.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510.0 93.0 L700.0 93.0" fill="none" stroke="#DC2626" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510.0 99.0 L700.0 99.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M510.0 99.0 L700.0 99.0" fill="none" stroke="#111827" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="700" y1="81" x2="722" y2="72.0" stroke="#A3A3A3" stroke-width="2.6" stroke-linecap="round"/>
<line x1="700" y1="87" x2="726" y2="84.0" stroke="#A3A3A3" stroke-width="2.6" stroke-linecap="round"/>
<line x1="700" y1="93" x2="730" y2="96.0" stroke="#A3A3A3" stroke-width="2.6" stroke-linecap="round"/>
<line x1="700" y1="99" x2="734" y2="108.0" stroke="#A3A3A3" stroke-width="2.6" stroke-linecap="round"/>
<text x="790.0" y="84.0" font-size="9.5" fill="#6B7280" text-anchor="start" dominant-baseline="central" font-weight="400">芯線に</text>
<text x="790.0" y="99.0" font-size="9.5" fill="#6B7280" text-anchor="start" dominant-baseline="central" font-weight="400">予備はんだ</text>
<text x="30.0" y="160.0" font-size="12" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700">3. ピンヘッダーを 4 ピン分に折って、1 本ずつはんだ付け。むき出しの所をテープで巻く</text>
<rect x="40" y="203" width="30" height="44" rx="4" fill="#F3F4F6" stroke="#9CA3AF"/>
<rect x="46" y="209" width="18" height="32" rx="2" fill="#E5E7EB" stroke="#9CA3AF"/>
<path d="M70.0 216.0 L300.0 216.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 216.0 L300.0 216.0" fill="none" stroke="#EAB308" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 222.0 L300.0 222.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 222.0 L300.0 222.0" fill="none" stroke="#F3F4F6" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 228.0 L300.0 228.0" fill="none" stroke="#6B7280" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70.0 228.0 L300.0 228.0" fill="none" stroke="#DC2626" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
