<title id="t">光で 1 文字を送るときの形</title>
<desc id="d">'H' (0x48) を送る例。消灯で待ち、点灯 1 ビットがスタート、データ 8 ビットを下位から、消灯 2 ビットがストップ。CdS の電圧は遅れてなまるので、スタートで明るくなった時刻から 1.5 ビット後、2.5 ビット後… のまん中で読む。</desc>
