<circle cx="500" cy="130" r="4.5" fill="#fff"/>
<text x="490.0" y="130.0" font-size="10" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1C</text>
<circle cx="500" cy="165" r="4.5" fill="#fff"/>
<text x="490.0" y="165.0" font-size="10" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">2C</text>
<circle cx="500" cy="200" r="4.5" fill="#fff"/>
<text x="490.0" y="200.0" font-size="10" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3C</text>
<circle cx="500" cy="235" r="4.5" fill="#fff"/>
<text x="490.0" y="235.0" font-size="10" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">4C</text>
<circle cx="500" cy="280" r="4.5" fill="#fff"/>
<text x="490.0" y="280.0" font-size="10" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">COM</text>
