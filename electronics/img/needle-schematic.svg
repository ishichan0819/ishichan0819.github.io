<path d="M500 165 L650 165" fill="none" stroke="#EC4899" stroke-width="3" stroke-linejoin="round"/>
<text x="644.0" y="155.0" font-size="9" fill="#EC4899" text-anchor="end" dominant-baseline="central" font-weight="700">ピンク</text>
<path d="M500 200 L650 200" fill="none" stroke="#EAB308" stroke-width="3" stroke-linejoin="round"/>
<text x="644.0" y="190.0" font-size="9" fill="#EAB308" text-anchor="end" dominant-baseline="central" font-weight="700">黄</text>
<path d="M500 235 L650 235" fill="none" stroke="#F97316" stroke-width="3" stroke-linejoin="round"/>
<text x="644.0" y="225.0" font-size="9" fill="#F97316" text-anchor="end" dominant-baseline="central" font-weight="700">橙</text>
<rect x="650" y="110" width="150" height="145" rx="10" fill="#EEF0F3" stroke="#9CA3AF"/>
<text x="725.0" y="128.0" font-size="12" fill="#1F2430" text-anchor="middle" dominant-baseline="central" font-weight="700">28BYJ-48</text>
<text x="725.0" y="146.0" font-size="9" fill="#6B7280" text-anchor="middle" dominant-baseline="central" font-weight="400">青 → ピンク → 黄 → 橙 の順に</text>
<text x="725.0" y="160.0" font-size="9" fill="#6B7280" text-anchor="middle" dominant-baseline="central" font-weight="400">1 本ずつ電気を流すと回る</text>
<circle cx="650" cy="130" r="4.5" fill="#6B7280"/>
<circle cx="650" cy="165" r="4.5" fill="#6B7280"/>
<circle cx="650" cy="200" r="4.5" fill="#6B7280"/>
<circle cx="650" cy="235" r="4.5" fill="#6B7280"/>
<text x="725.0" y="196.0" font-size="9.5" fill="#1F2430" text-anchor="middle" dominant-baseline="central" font-weight="700">コイル 2 つ</text>
<text x="725.0" y="212.0" font-size="9" fill="#6B7280" text-anchor="middle" dominant-baseline="central" font-weight="400">(ピンク–橙、黄–青)</text>
<text x="725.0" y="236.0" font-size="9.5" fill="#DC2626" text-anchor="middle" dominant-baseline="central" font-weight="700">まん中の赤 = 5V</text>
