<text x="168.0" y="320.0" font-size="11" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3V3</text>
<circle cx="180" cy="365" r="4.5" fill="#0F766E"/>
<text x="168.0" y="365.0" font-size="11" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">IO34</text>
<rect x="330" y="100" width="170" height="210" rx="8" fill="#202329"/>
<text x="415.0" y="120.0" font-size="13" fill="#fff" text-anchor="middle" dominant-baseline="central" font-weight="700">ULN2003AN</text>
<text x="415.0" y="136.0" font-size="9" fill="#C9CDD6" text-anchor="middle" dominant-baseline="central" font-weight="400">電流を流す役 (7 回路)</text>
