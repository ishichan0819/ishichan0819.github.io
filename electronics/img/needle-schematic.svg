<rect x="30" y="40" width="150" height="360" rx="8" fill="#15171C"/>
<text x="105.0" y="62.0" font-size="14" fill="#fff" text-anchor="middle" dominant-baseline="central" font-weight="700">ESP32</text>
<text x="105.0" y="80.0" font-size="10" fill="#C9CDD6" text-anchor="middle" dominant-baseline="central" font-weight="400">Freenove WROOM</text>
<circle cx="180" cy="80" r="4.5" fill="#E11D48"/>
<text x="168.0" y="80.0" font-size="11" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">5V</text>
<circle cx="180" cy="130" r="4.5" fill="#A16207"/>
<text x="168.0" y="130.0" font-size="11" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">IO14</text>
