<circle cx="330" cy="200" r="4.5" fill="#fff"/>
<text x="340.0" y="200.0" font-size="10" fill="#fff" text-anchor="start" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">3B</text>
