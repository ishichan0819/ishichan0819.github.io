<circle cx="180" cy="200" r="4.5" fill="#0284C7"/>
<text x="168.0" y="200.0" font-size="11" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">IO26</text>
<circle cx="180" cy="235" r="4.5" fill="#16A34A"/>
<text x="168.0" y="235.0" font-size="11" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">IO25</text>
<circle cx="180" cy="280" r="4.5" fill="#1F2937"/>
<text x="168.0" y="280.0" font-size="11" fill="#fff" text-anchor="end" dominant-baseline="central" font-weight="700" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">GND</text>
