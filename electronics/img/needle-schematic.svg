<text x="600.0" y="328.0" font-size="9" fill="#6B7280" text-anchor="middle" dominant-baseline="central" font-weight="400">COM にも 5V (中のダイオードがコイルの逆電圧を逃がす)</text>
<path d="M180 320 L300 320 L300 330" fill="none" stroke="#EA8A00" stroke-width="3" stroke-linejoin="round"/>
<rect x="293" y="330" width="14" height="22" rx="3" fill="#D7E8EF" stroke="#7FA7B8"/>
<path d="M286 356 l28 -30" stroke="#1F2430" stroke-width="1.4"/>
<text x="320.0" y="338.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700">サーミスター (25℃ で 10kΩ)</text>
<path d="M300 352 L300 365 L180 365" fill="none" stroke="#0F766E" stroke-width="3" stroke-linejoin="round"/>
<circle cx="300" cy="365" r="4.5" fill="#0F766E"/>
<path d="M300 365 L300 372" fill="none" stroke="#1F2937" stroke-width="3" stroke-linejoin="round"/>
<path d="M300 372 l-6 3 l12 5 l-12 5 l12 5 l-6 3 l0 4" fill="none" stroke="#1F2430" stroke-width="1.6"/>
<text x="314.0" y="384.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700">10kΩ</text>
<path d="M288 400 h24 M292 405 h16 M296 410 h8" stroke="#1F2430" stroke-width="1.8"/>
<path d="M300 397 L300 400" fill="none" stroke="#1F2937" stroke-width="3" stroke-linejoin="round"/>
<text x="470.0" y="360.0" font-size="10" fill="#1F2430" text-anchor="start" dominant-baseline="central" font-weight="700">温かい → サーミスターの抵抗が下がる → IO34 の電圧が上がる</text>
<text x="470.0" y="378.0" font-size="9.5" fill="#6B7280" text-anchor="start" dominant-baseline="central" font-weight="400">温度 = 1 ÷ (1/298.15 + ln(R/10k) ÷ 3960) − 273.15  (B 定数の式)</text>
</svg>
