<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Noto Sans CJK JP',Meiryo,sans-serif">
<title id="t">針で指す温度計の回路図</title>
<desc id="d">ESP32 の IO14・IO27・IO26・IO25 を ULN2003AN の 1B〜4B に。1C〜4C をモーターの青・ピンク・黄・橙に。モーターの赤と COM は 5V、E は GND。3V3 からサーミスターと 10kΩ で分圧し、中点を IO34 へ。</desc>
